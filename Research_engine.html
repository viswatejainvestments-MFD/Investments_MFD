function clamp(v,lo,hi){return Math.min(hi,Math.max(lo,v));}
function norm(v,lo,hi){return hi<=lo?50:clamp((v-lo)/(hi-lo)*100,0,100);}
const fmtAUM=a=>a>=10000?'₹'+(a/1000).toFixed(1)+'K Cr':'₹'+a.toLocaleString('en-IN')+' Cr';

function scoreAll(funds){
  return funds.map(f=>{
    const ca=CAT_AVG[f.cat];
    const raw=
      norm(f.or,60,100)*0.30+
      norm(f.er,2.0,10)*0.20+
      norm(f.sh,1.0,2.0)*0.15+
      norm(f.so,1.0,2.5)*0.10+
      norm(100-f.dc,0,30)*0.10+
      norm(f.ten,3,12)*0.05+
      clamp(f.aum>=ca.aum?100:(f.aum/ca.aum)*100,0,100)*0.05+
      clamp(((ca.exp-f.exp)/ca.exp)*250+20,0,100)*0.05;
    return {...f,score:Math.round(50+raw*0.46)};
  }).sort((a,b)=>b.score-a.score);
}

function getRating(s){
  if(s>=85)return{label:"A+",bg:"#E1F5EE",color:"#085041",border:"#5DCAA5"};
  if(s>=75)return{label:"A", bg:"#EAF3DE",color:"#27500A",border:"#97C459"};
  if(s>=65)return{label:"B+",bg:"#FAEEDA",color:"#633806",border:"#EF9F27"};
  if(s>=55)return{label:"B", bg:"#FAC775",color:"#412402",border:"#BA7517"};
  return         {label:"C", bg:"#FCEBEB",color:"#791F1F",border:"#F09595"};
}

function processSteps(all){
  let pool=[...all];
  const steps=[];
  function filt(n,title,sub,rule,fn,mLabel,mVal,failMsg){
    const pass=pool.filter(fn),fail=pool.filter(f=>!fn(f));
    steps.push({n,title,sub,rule,pass:pass.length,fail:fail.length,elim:fail,mLabel,mVal,failMsg,info:false,isFinal:false});
    pool=pass;
  }
  filt(1,"Universe & age filter","Fund age ≥ 5 years",
    "Include only equity mutual funds (Flexi Cap, Large Cap, Mid Cap, Small Cap, Large & Mid Cap, Multi Cap) with at least 5 years of operating history. Newer funds lack the track record needed for meaningful evaluation.",
    f=>f.age>=5,"Fund age",f=>`${f.age.toFixed(1)} yrs`,f=>`${f.age.toFixed(1)} yrs old — below 5-yr minimum`);
  steps.push({n:2,title:"Rolling return window",sub:"1-year rolling · last 4 years · ~1,000 observations per fund",
    rule:"For each surviving fund, compute 1-year rolling returns for every trading day over the past 4 years, generating ~1,000 data points per fund. Crucially, each fund is compared against its own category benchmark — not the generic Nifty 50 — to ensure fair comparison and avoid penalising mid/small cap funds that naturally outperform large-cap indices.",
    pass:pool.length,fail:0,elim:[],info:true,isFinal:false,
    benchmarks:[["Large Cap","NIFTY 100"],["Mid Cap","NIFTY Midcap 150"],["Small Cap","NIFTY Smallcap 250"],["Flexi Cap","NIFTY 500"],["Large & Mid Cap","NIFTY LargeMidcap 250"],["Multi Cap","NIFTY 500 Multicap 50:25:25"]]});
  filt(3,"Outperformance ratio","Win rate vs category benchmark > 60%",
    "The fund must beat its category benchmark in more than 60% of all rolling 1-year windows. A fund that consistently lags the index on most periods does not justify active management costs.",
    f=>f.or>60,"Outperformance ratio",f=>`${f.or}%`,f=>`Win rate ${f.or}% — at or below 60% threshold`);
  filt(4,"Excess return test","Avg excess return > 2% p.a.",
    "Winning frequently but by tiny margins offers little practical value over a passive index fund after accounting for expenses. The average excess return across all rolling windows must exceed 2% per annum.",
    f=>f.er>2.0,"Avg excess return",f=>`+${f.er.toFixed(1)}%`,f=>`Avg excess +${f.er.toFixed(1)}% — at or below 2% threshold`);
  filt(5,"Downside protection","Downside capture ratio < 100%",
    "During periods when the benchmark falls, the fund must fall less. A downside capture ratio at or above 100% means the fund amplifies losses — a disqualifying trait for wealth preservation mandates.",
    f=>f.dc<100,"Downside capture ratio",f=>`${f.dc}%`,f=>`DC ratio ${f.dc}% — at or above 100% (amplifies losses)`);
  filt(6,"Risk-adjusted filter","Sharpe ratio > category average",
    "The fund must deliver above-average risk-adjusted returns within its category. A below-average Sharpe ratio means investors are bearing excess volatility without commensurate reward relative to category peers.",
    f=>f.sh>CAT_AVG[f.cat].sh,"Sharpe ratio",f=>`${f.sh.toFixed(2)}`,f=>`Sharpe ${f.sh.toFixed(2)} — at or below category avg ${CAT_AVG[f.cat].sh.toFixed(2)}`);
  filt(7,"Manager stability","Current manager tenure ≥ 3 years",
    "Historical performance belongs to the manager who generated it. If the current fund manager has been at the helm for fewer than 3 years, the historical NAV track record may not be attributable to them.",
    f=>f.ten>=3,"Manager tenure",f=>`${f.ten.toFixed(1)} yrs`,f=>`Tenure ${f.ten.toFixed(1)} yrs — below 3-yr minimum`);
  filt(8,"AUM threshold","AUM > ₹500 crores",
    "Funds below ₹500 crores face liquidity constraints, elevated redemption risk, and potential wind-down. Minimum AUM ensures operational resilience and the ability to execute large block trades without market impact.",
    f=>f.aum>500,"AUM",f=>fmtAUM(f.aum),f=>`AUM ${fmtAUM(f.aum)} — below ₹500 Cr floor`);
  filt(9,"Cost efficiency","Expense ratio < category average",
    "Every basis point of expense ratio erodes investor wealth directly and permanently. We only include funds that charge below their category average — the manager must justify their fee through genuine, sustainable alpha generation.",
    f=>f.exp<CAT_AVG[f.cat].exp,"Expense ratio",f=>`${f.exp.toFixed(2)}%`,f=>`Expense ${f.exp.toFixed(2)}% — at or above category avg ${CAT_AVG[f.cat].exp.toFixed(2)}%`);
  const scored=scoreAll(pool);
  steps.push({n:10,title:"Final scoring & ranking",sub:"Weighted multi-factor composite score",
    rule:"Each surviving fund is scored across 8 factors using absolute reference ranges, then weighted: rolling outperformance 30% · excess return 20% · Sharpe ratio 15% · Sortino ratio 10% · downside capture 10% · manager tenure 5% · AUM 5% · expense ratio 5%. Raw scores are scaled to the 50–100 range. Top 10 funds receive Yours Wealth ratings.",
    pass:Math.min(10,scored.length),fail:Math.max(0,scored.length-10),
    elim:scored.slice(10),info:false,isFinal:true,top10:scored.slice(0,10),allScored:scored});
  return{steps,total:all.length};
}
